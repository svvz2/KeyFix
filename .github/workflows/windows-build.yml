name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build, test, and package
        shell: pwsh
        run: .\build-packages.ps1

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keyfix-windows
          path: |
            artifacts/KeyFix-*-win-x64.zip
            artifacts/KeyFix-*-source.zip
            artifacts/SHA256SUMS.txt

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $userPackage = (Get-ChildItem artifacts\KeyFix-*-win-x64.zip -File | Select-Object -First 1).FullName
          $sourcePackage = (Get-ChildItem artifacts\KeyFix-*-source.zip -File | Select-Object -First 1).FullName
          $checksums = (Get-Item artifacts\SHA256SUMS.txt).FullName
          gh release create $env:GITHUB_REF_NAME $userPackage $sourcePackage $checksums --generate-notes --title "KeyFix $env:GITHUB_REF_NAME"
